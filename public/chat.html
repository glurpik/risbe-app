<div class="card chat-container">
    <div id="chat-window" style="height: 300px; overflow-y: auto; text-align: left; padding: 10px; border-bottom: 1px solid #555;">
        </div>
    <input type="text" id="receiver-nick" placeholder="Кому пишем (логин)?">
    <input type="text" id="msg-text" placeholder="Сообщение...">
    <button onclick="sendMessage()">Отправить 🚀</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    const myName = localStorage.getItem('username'); // Сохрани его при логине!

    socket.emit('join', myName);

    function sendMessage() {
        const receiver = document.getElementById('receiver-nick').value;
        const text = document.getElementById('msg-text').value;
        
        socket.emit('private_message', { sender: myName, receiver, text });
        
        // Добавляем себе на экран
        appendMsg('Вы', text);
        document.getElementById('msg-text').value = '';
    }

    socket.on('new_message', (data) => {
        appendMsg(data.sender, data.text);
    });

    function appendMsg(sender, text) {
        const win = document.getElementById('chat-window');
        win.innerHTML += `<div><b>${sender}:</b> ${text}</div>`;
    }
</script>
